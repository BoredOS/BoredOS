# ==============================================================================
# BoredOS System Configuration
# ==============================================================================

# --- System & Identity --------------------------------------------------------
hostname="boredos"
hostname_enable="YES"
timezone="Europe/Amsterdam"
cleanvar_enable="YES"
motd_enable="YES"

# --- Networking ---------------------------------------------------------------
# Dynamic auto-detection:
ifconfig_auto="DHCP"

# Static / manual interface overrides (examples):
# ifconfig_em0="inet 192.168.1.50 netmask 255.255.255.0"
# defaultrouter="192.168.1.1"

ifconfig_lo0="inet 127.0.0.1"

resolv_enable="YES"
nameserver="1.1.1.1"

# --- Core Daemons -------------------------------------------------------------
klogd_enable="YES"
ntp_enable="YES"
ntp_server="pool.ntp.org"

# --- Optional & Userland Services ---------------------------------------------
# HTTP Web Server
httpd_enable="NO"
httpd_port="80"
httpd_root="/Library/WebServer/Documents"

# Desktop Environment
nova_enable="NO"

# Local startup hooks (/etc/rc.local)
#local_enable="YES"